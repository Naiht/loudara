name: Update youtubei.js

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: update
        name: Resolve the newest youtubei.js
        run: |
          pnpm up --latest -D youtubei.js
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').devDependencies['youtubei.js']")" >> "$GITHUB_OUTPUT"
          fi

      - id: verify
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm test && pnpm build

      - name: Commit the verified update
        if: steps.update.outputs.changed == 'true' && steps.verify.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): update youtubei.js to ${{ steps.update.outputs.version }}"
          git push

      - name: Mark an incompatible update as pending
        if: steps.update.outputs.changed == 'true' && steps.verify.outcome != 'success'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.update.outputs.version }}
        with:
          script: |
            const title = 'youtubei.js update pending verification';
            const body = `Automated update to ${process.env.VERSION} did not pass \`pnpm test && pnpm build\`. The deployed version was not changed; review and update the app before retrying.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
