name = "api"
main = "src/backend/worker.ts"
compatibility_date = "2026-03-05"
compatibility_flags = [ "nodejs_compat" ]

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/album",
  "/artist",
  "/channel",
  "/gallery",
  "/playlist",
  "/search",
  "/search-suggestions",
  "/similar",
  "/subfeed",
  "/trending",
  "/stream/*",
  "/media/*",
  "/api/*",
  "/s/*"
]
